plugins {
    id 'com.android.application' version '8.2.0'
}

android {
    namespace 'com.audio.sound.master'
    compileSdk 34
    
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.audio.sound.master"
        minSdk 26 // ⚠️ FIX 2: Aligned with Application.mk (android-26)
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // 🔥 FIX 1: Sirf Real Modern 64-bit Mobile Processors ke liye compile karein
        ndk {
            abiFilters "arm64-v8a" 
        }

        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK:=src/main/jni/Application.mk"
                cFlags "-O3 -std=c++17 -march=armv8-a -mfpu=neon -mfloat-abi=softfp"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Aapka project CMakeLists.txt bhi rakhta hai, par yahan hum Android.mk (NDKBuild) use kar rahe hain, jo ke bilkul perfect hai.
    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }
}
