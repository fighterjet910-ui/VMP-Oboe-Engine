name: VMP Oboe Cloud Build (Warp Speed)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Zipped Project
      run: unzip Project.zip -d .

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Modern Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b 

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4

    # Using global gradle compiler for trillion times faster execution without wrapper errors
    - name: Compile VMP Engine (Warp Speed)
      run: gradle assembleDebug --parallel --build-cache --stacktrace

    - name: Upload Final APK
      uses: actions/upload-artifact@v4
      with:
        name: Elite-VMP-Oboe-APK
        path: app/build/outputs/apk/debug/*.apk
        
