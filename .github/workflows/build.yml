name: VMP Oboe Cloud Build (Modern)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Zipped Project
      run: |
        unzip -o Project.zip -d .
        echo "=== Scanning Directory Structure ==="
        ls -R

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Modern Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Setup Android SDK Utilities
      uses: android-actions/setup-android@v3

    - name: Auto-Generate Root Project Wrapper & Workspace
      run: |
        # 1. Dynamically locate where your actual app module folder is hidden
        APP_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
        
        if [ -z "$APP_DIR" ]; then
          echo "ERROR: Could not find any folder containing an app level build.gradle file!"
          exit 1
        fi
        
        # Clean folder reference name (e.g., if it's "./Project", extract "Project")
        MODULE_NAME=$(basename "$APP_DIR")
        echo "Found app module folder named: $MODULE_NAME at path: $APP_DIR"

        # 2. If it's already extracted right in the root, rename the module folder 
        # so it doesn't conflict with root-level configuration files
        if [ "$APP_DIR" = "." ]; then
          echo "App directory is flat in workspace root. Re-structuring to standard layout..."
          mkdir tmp_module
          # Move files while ignoring system hidden folders
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.github' ! -name 'tmp_module' -exec mv {} tmp_module/ \;
          MODULE_NAME="app"
          mv tmp_module "$MODULE_NAME"
        fi

        # 3. Force-create a fresh, reliable standard root configuration
        echo "include ':$MODULE_NAME'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 4. Generate official, uncorrupted Gradle 8.2 wrapper system files
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        
        echo "=== Root Structural Generation Complete ==="
        ls -la

    - name: Compile VMP Engine via Generated Wrapper
      run: |
        ./gradlew assembleDebug --stacktrace

    - name: Find and Upload Final APK
      uses: actions/upload-artifact@v4
      with:
        name: VMP-Oboe-Engine-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          
