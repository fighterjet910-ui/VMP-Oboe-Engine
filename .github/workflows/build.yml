name: VMP Oboe Cloud Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4  # Updated to v4

    - name: Extract Zipped Project
      run: unzip Project.zip -d .

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4  # Updated to v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Modern Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b 

    - name: Setup Gradle Compiler
      uses: gradle/actions/setup-gradle@v3 # Updated to latest Gradle action

    - name: Compile VMP Engine
      run: gradle assembleDebug --stacktrace

    - name: Upload Final APK
      uses: actions/upload-artifact@v4  # THE MAIN FIX: Updated to v4
      with:
        name: VMP-Oboe-Engine-APK
        path: app/build/outputs/apk/debug/*.apk
        
